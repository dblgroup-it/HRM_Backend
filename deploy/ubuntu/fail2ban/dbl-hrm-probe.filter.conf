# fail2ban filter: requests nginx dropped as attacks (status 444, from
# dbl-hrm-block-probes.conf). Installed as /etc/fail2ban/filter.d/dbl-hrm-probe.conf.
# Matches the default "combined" access log line:
#   1.2.3.4 - - [03/Oct/2026:10:02:26 +0600] "GET /.env HTTP/1.1" 444 0 "-" "curl/8.7.1"
[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[^"]*" 444 \d+
ignoreregex =
