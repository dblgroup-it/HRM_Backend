# DBL HRM — nginx site for the Ubuntu server.
#
# Installed by setup-server.sh as /etc/nginx/sites-available/dbl-hrm, with
# __DOMAIN__ and __WEB_ROOT__ filled in. Ubuntu's nginx.conf already holds the
# http {} block, so this file is server blocks only. Every rule here is carried
# over from ../nginx.conf.example (the Windows server's config) — the reasons
# are written up there; read them before changing anything.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.crt;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Above the API's largest upload (requisition attachments, 15 MB), or big
    # files die here with a 413 the application never sees.
    client_max_body_size 20m;
    client_body_timeout 60s;

    # Security headers live in a snippet because nginx drops every inherited
    # add_header in a location that sets its own — so the two cache-policy
    # locations below must include it again, or index.html (the one document
    # the CSP exists for) is served without one.
    include snippets/dbl-hrm-security-headers.conf;

    root __WEB_ROOT__;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI CV reading and PDF rendering can outlast nginx's 60s default.
        proxy_read_timeout 180s;
    }

    # Socket.IO lives at the server root, not under /api. Without this block
    # the SPA fallback answers the handshake with HTML and realtime silently
    # never connects.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # A cached index.html asks for asset hashes the last deploy deleted.
    location = /index.html {
        include snippets/dbl-hrm-security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Content-hashed, immutable; =404 so a missing chunk is not served as HTML.
    location /assets/ {
        include snippets/dbl-hrm-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
