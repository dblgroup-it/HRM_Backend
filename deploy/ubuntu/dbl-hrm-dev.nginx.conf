# DBL HRM — the DEV server, https://__DOMAIN__:4500
#
# Install as /etc/nginx/sites-available/dbl-hrm-dev (see DEV_SERVER.md).
# The same certificate as the live site (it is valid for the name on any
# port), the dev API on 4600, the dev build in __WEB_ROOT__. Everything else
# is the live site's config — read dbl-hrm.nginx.conf for the reasons.

server {
    listen 4500 ssl http2;
    listen [::]:4500 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/__DOMAIN__.crt;
    ssl_certificate_key /etc/nginx/ssl/__DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # A plain http:// request to this port gets a redirect, not a TLS error.
    error_page 497 =301 https://$host:4500$request_uri;

    client_max_body_size 20m;
    client_body_timeout 60s;

    include snippets/dbl-hrm-security-headers.conf;
    # A copy of real people's data: keep it out of every search engine.
    add_header X-Robots-Tag "noindex, nofollow" always;

    root __WEB_ROOT__;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /index.html {
        include snippets/dbl-hrm-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        include snippets/dbl-hrm-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
