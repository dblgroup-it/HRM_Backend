# Turn away what only an attack would ask for — included by every DBL HRM
# server block (live and dev), installed as /etc/nginx/snippets/.
#
# Every pattern is something this app never serves: it is Node.js behind a
# built single-page app — no PHP, no dotfiles, no CMS, no backups on disk.
# `return 444` closes the connection without answering, so a scanner learns
# nothing, the request never reaches the app (or its API log), and fail2ban
# (jail dbl-hrm-probe) bans an address that collects a few.
#
# Regex locations are checked after the prefix ones (/api/, /assets/, /) and
# win over them, so these apply under every path. Only the path is matched,
# never the query string: a search for "x.php" is not an attack.

# Dotfiles and dot-folders (.env, .git, .aws, .DS_Store, .vscode …).
# /.well-known/ stays open for certificate renewal.
location ~ /\.(?!well-known/) {
    return 444;
}

# Server-side scripts, backups and config files, by extension.
location ~* \.(php\d?|phtml|phar|asp|aspx|ashx|asmx|jsp|jspx|cgi|pl|bak|backup|old|orig|save|swp|sql|sqlite3?|mdb|ini|env|ya?ml|toml|htaccess|htpasswd)$ {
    return 444;
}

# The usual targets of PHP, CMS, router and Java exploit kits, at the root or
# under /api/ (the probes seen were /api/vendor/phpunit/...).
location ~* ^(/api)?/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|phpmyadmin|pma|myadmin|adminer|cgi-bin|boaform|HNAP1|vendor/|phpunit|owa/|ecp/|autodiscover|remote/login|solr/|actuator|manager/html|jenkins|druid/|telescope|_ignition|geoserver) {
    return 444;
}
