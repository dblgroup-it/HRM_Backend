# Included by dbl-hrm.nginx.conf — at server level and again in every location
# that sets its own add_header (nginx does not merge them). Rationale for each
# header, the CSP especially, is in ../nginx.conf.example.
#
# 'wasm-unsafe-eval' lets the page compile WebAssembly and nothing else — not
# JS eval(), not inline script. The Lottie loader (Spinner.tsx) runs on a WASM
# player; without it the browser refuses to compile it and the loader is blank.
add_header Strict-Transport-Security "max-age=604800" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
